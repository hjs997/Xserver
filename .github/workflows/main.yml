
name: 🪄 XServer自动签到

on:
  # schedule:
  #   - cron: '0 */12 * * *'
  workflow_dispatch:

# 防止同一分支重复并发运行
concurrency:
  group: xserver-auto-renew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
      # 1. 检出仓库
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Chrome、Xvfb 和字体
      - name: 🌐 安装官方 Google Chrome、Xvfb 及中日文字体
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            xvfb \
            fonts-noto-cjk \
            gnupg \
            ca-certificates

          sudo install -d -m 0755 /etc/apt/keyrings

          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/google-chrome.gpg > /dev/null

          sudo chmod 644 /etc/apt/keyrings/google-chrome.gpg

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          google-chrome --version

      # 3. 设置 Python
      - name: ⚙ 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. 缓存 Python 依赖
      - name: 📦 缓存 Python 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. 安装 Python 依赖
      - name: 🛠️ 安装 Python 依赖
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install patchright requests

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      # 6. 启动 sing-box，失败自动回退直连
      - name: ⚙ 设置代理 (sing-box，失败自动直连)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -u

          # 默认直连
          echo "PROXY_SERVER=" >> "$GITHUB_ENV"

          if [ -z "${NODE_LINK:-}" ]; then
            echo "⚠️ 未配置 NODE_LINK，使用 GitHub Actions 直连"
            exit 0
          fi

          echo "🔧 正在下载 sing-box 安装脚本..."

          if ! wget -qO setup_proxy.sh \
            https://main.ssss.nyc.mn/setup_proxy.sh; then
            echo "⚠️ 安装脚本下载失败，回退直连"
            exit 0
          fi

          if [ ! -s setup_proxy.sh ]; then
            echo "⚠️ 安装脚本为空，回退直连"
            exit 0
          fi

          echo "🔧 正在执行 sing-box 安装脚本..."

          if ! bash setup_proxy.sh; then
            echo "⚠️ sing-box 安装失败，尝试回退直连"
            exit 0
          fi

          sleep 5

          echo "🔍 检查 SOCKS5 端口..."

          if ! python -c "import socket; s=socket.create_connection(('127.0.0.1',1080),timeout=5); s.close()" 2>/dev/null; then
            echo "⚠️ SOCKS5 端口未启动，回退直连"
            exit 0
          fi

          echo "🔍 检查代理是否可以访问 XServer..."

          if ! curl \
            --socks5-hostname 127.0.0.1:1080 \
            --connect-timeout 10 \
            --max-time 30 \
            -sS -L \
            -o /dev/null \
            https://secure.xserver.ne.jp/xapanel/login/xmgame; then
            echo "⚠️ 代理无法访问 XServer，回退直连"
            exit 0
          fi

          echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"

          echo "✅ sing-box 代理可用，后续使用代理"

      # 7. 随机延迟
      - name: 🎲 随机延迟（0-120秒）
        run: |
          delay=$((RANDOM % 120))
          echo "⏳ 随机等待 ${delay} 秒"
          sleep "$delay"

      # 8. 执行自动续期
      - name: 🚀 运行脚本 (使用 Xvfb 虚拟窗口渲染)
        env:
          XSERVER_EMAIL: ${{ secrets.XSERVER_EMAIL }}
          XSERVER_PASSWORD: ${{ secrets.XSERVER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
        run: |
          set -e

          if [ -n "${PROXY_SERVER:-}" ]; then
            echo "🌐 当前使用 sing-box SOCKS5 代理"
          else
            echo "🌐 当前使用 GitHub Actions 直连"
          fi

          xvfb-run --auto-servernum python renew.py

      # 9. 上传截图
      - name: 📸 上传运行截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 7

      # 10. 更新时间文件并推送
      - name: 🕒 Commit time.txt to repo
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"
          NOW="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"

          echo "$NOW" > time.txt
          git add time.txt

          if git diff --cached --quiet; then
            echo "ℹ️ 无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $NOW"

            success=0

            for i in 1 2 3 4 5; do
              echo "📤 Push attempt $i/5"

              git fetch origin "$BRANCH"

              if ! git rebase "origin/$BRANCH"; then
                echo "❌ Rebase 失败"
                git rebase --abort || true
                exit 1
              fi

              if git push origin "HEAD:$BRANCH"; then
                echo "✅ 推送成功"
                success=1
                break
              fi

              echo "⚠️ 推送失败，第 $i 次重试"

              if [ "$i" -lt 5 ]; then
                sleep 3
              fi
            done

            if [ "$success" -ne 1 ]; then
              echo "❌ 5 次推送均失败"
              exit 1
            fi
          fi

      # 11. 清理旧的已完成运行记录
      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "🔍 获取已完成的工作流记录..."

          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --status completed \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue

            count=$((count + 1))

            if [ "$count" -gt 1 ]; then
              echo "🗑️ 删除旧运行记录: $run_id"
              gh run delete "$run_id" || true
            else
              echo "保留最新已完成记录: $run_id"
            fi
          done <<< "$runs"

          echo "✅ 历史记录清理完成"
