name: 🪄 XServer自动签到

on:
  schedule:
    - cron: '0 0/12 * * *'  # 每 12 小时自动运行一次
  workflow_dispatch:        # 支持手动点击触发

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 优化 Apt 源与安装 Xvfb 虚拟显示
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          sudo sed -i 's|http://*.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          sudo apt-get update -o Acquire::Connect-Timeout=10 -o Acquire::Request-Timeout=10
          sudo apt-get install -y xvfb

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖与 Playwright 浏览器
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 设置代理隧道 (Gost)
        id: gost_setup
        env:
          PROXY_STR: ${{ secrets.PROXY_SERVER }}
        run: |
          if [ -z "$PROXY_STR" ]; then
            echo "⚠️ 未配置 PROXY_SERVER，跳过代理隧道搭建，降级为直连模式"
            echo "USE_LOCAL_PROXY=false" >> $GITHUB_ENV
            exit 0
          fi

          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip -f gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          nohup ./gost-linux-amd64-2.11.5 -L :1080 -F "$PROXY_STR" > gost.log 2>&1 &
          sleep 5
          cat gost.log || true
          
          echo "🧪 测试代理连通性与出站 IP:"
          if curl -s -x socks5://127.0.0.1:1080 --max-time 10 https://api.ipify.org?format=json; then
            echo "✅ 代理连接成功！"
            echo "USE_LOCAL_PROXY=true" >> $GITHUB_ENV
          else
            echo "❌ 代理节点报错或连通失败，自动降级为直连模式"
            echo "USE_LOCAL_PROXY=false" >> $GITHUB_ENV
          fi

      - name: 🎲 随机延迟（0-120秒）
        run: |
          delay=$((RANDOM % 120))
          echo "Random delay: ${delay}s"
          sleep $delay

      - name: 运行脚本 (使用 Xvfb 虚拟窗口渲染)
        env:
          XSERVER_EMAIL: ${{ secrets.XSERVER_EMAIL }}
          XSERVER_PASSWORD: ${{ secrets.XSERVER_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_SERVER: ${{ env.USE_LOCAL_PROXY == 'true' && 'socks5://127.0.0.1:1080' || '' }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
        run: |
          xvfb-run --auto-servernum python renew.py

      - name: 📸 上传运行截图 (便于排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: '*.png'

      - name: Commit time.txt to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi

          git add time.txt

          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "推送冲突，第 $i 次重试中..."
              sleep 2
            done
          fi

      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
